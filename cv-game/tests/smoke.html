<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>RUNNING</title></head>
<body>
<pre id="log"></pre>
<script>
const log = document.getElementById('log');
const errors = [];

function out(msg) { log.textContent += msg + '\n'; }
window.onerror = (m, u, l) => { errors.push(`${m} at ${u}:${l}`); };
window.addEventListener('unhandledrejection', e => { errors.push('Rejection: ' + e.reason); });

function finish() {
    if (document.title !== 'RUNNING') return;
    if (errors.length) errors.forEach(e => out('✗ ' + e));
    const pass = errors.length === 0;
    out(pass ? '\nRESULT: PASS' : '\nRESULT: FAIL');
    document.title = pass ? 'PASS' : 'FAIL';
}
</script>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script type="module">
import { TitleScreen } from '../src/scenes/TitleScreen.js';
import { World1_Saarbruecken } from '../src/scenes/World1_Saarbruecken.js';
import { World2_Freiburg } from '../src/scenes/World2_Freiburg.js';
import { World3_Macau } from '../src/scenes/World3_Macau.js';
import { World4_SanFrancisco } from '../src/scenes/World4_SanFrancisco.js';
import { World5_NYC } from '../src/scenes/World5_NYC.js';
import { World6_Office } from '../src/scenes/World6_Office.js';
import { VictoryScreen } from '../src/scenes/VictoryScreen.js';
import { SIDE_QUESTS, SECRETS } from '../src/config/quests.js';

out('✓ All module imports OK');

// Every listed secret must be a secret spot on some map, and every side quest's completion
// flag must be set by some dialogue node (bugs_cleared_wN is set by the game code itself).
const secretSpots = new Set(), spotSets = new Set();

// Every position (collision-box centre, display px, 4 px grid) the player's box can reach from
// the spawn without overlapping a wall tile or a static NPC body. Closer to the real physics
// than BaseScene._reachableTiles, which is deliberately conservative for paper placement.
function finePositions(scene, col) {
    const { walls, bs } = scene._walk, S = scene._S, T = bs * S, STEP = 4;
    const body = scene.player.sprite.body, hw = body.width / 2, hh = body.height / 2;
    const npcBoxes = scene.npcBodies.getChildren().map(z => [z.x - z.width/2, z.y - z.height/2, z.x + z.width/2, z.y + z.height/2]);
    const W = col.world_width * S, H = col.world_height * S;
    const free = (cx, cy) => {
        const x0 = cx - hw, y0 = cy - hh, x1 = cx + hw, y1 = cy + hh;
        if (x0 < 0 || y0 < 0 || x1 > W || y1 > H) return false;
        for (let ty = Math.floor(y0 / T); ty <= Math.floor((y1 - 0.01) / T); ty++)
            for (let tx = Math.floor(x0 / T); tx <= Math.floor((x1 - 0.01) / T); tx++)
                if (walls.has(tx + ',' + ty)) return false;
        return !npcBoxes.some(([a, b, c, d]) => x0 < c && x1 > a && y0 < d && y1 > b);
    };
    const sp = col.player_spawn || { x: 350, y: 400 };
    const spr = scene.player.sprite;
    const sx = Math.round((sp.x * S + body.center.x - spr.x) / STEP), sy = Math.round((sp.y * S + body.center.y - spr.y) / STEP);
    const seen = new Set([sx + ',' + sy]), stack = [[sx, sy]], out = [];
    while (stack.length) {
        const [x, y] = stack.pop(); out.push([x * STEP, y * STEP]);
        for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
            const k = (x+dx) + ',' + (y+dy);
            if (!seen.has(k) && free((x+dx) * STEP, (y+dy) * STEP)) { seen.add(k); stack.push([x+dx, y+dy]); }
        }
    }
    return out;
}
async function checkQuestData() {
    SECRETS.filter(id => !secretSpots.has(id)).forEach(id => errors.push(`quests.js: secret ${id} is not a secret spot on any map`));
    const sets = new Set(spotSets);
    const walk = (o) => {
        if (Array.isArray(o)) { o.forEach(walk); return; }
        if (!o || typeof o !== 'object') return;
        if (o.set) [].concat(o.set).forEach(f => sets.add(f));
        Object.values(o).forEach(walk);
    };
    for (let w = 1; w <= 6; w++) walk(await (await fetch(`../data/world${w}_npcs.json`)).json());
    SIDE_QUESTS.filter(q => !/^bugs_cleared_w\d$/.test(q.flag) && !sets.has(q.flag))
        .forEach(q => errors.push(`quests.js: side quest flag ${q.flag} is never set`));
    out(`✓ Quest data checked: ${SIDE_QUESTS.length} side quests, ${secretSpots.size} secret spots`);
}

const scenes = [TitleScreen, World1_Saarbruecken, World2_Freiburg, World3_Macau, World4_SanFrancisco, World5_NYC, World6_Office, VictoryScreen];
const toTest = ['TitleScreen', 'World1_Saarbruecken', 'World2_Freiburg', 'World3_Macau', 'World4_SanFrancisco', 'World5_NYC', 'World6_Office', 'VictoryScreen'];
const tested = new Set();

const config = {
    type: Phaser.AUTO,
    pixelArt: true, width: 800, height: 600,
    backgroundColor: '#222034',
    scale: { mode: Phaser.Scale.NONE },
    physics: { default: 'arcade', arcade: { gravity: { y: 0 } } },
    audio: { noAudio: true },
    input: { activePointers: 2 },
    loader: { baseURL: '../' },
    scene: scenes
};

try {
    const game = new Phaser.Game(config);
    out('✓ Phaser game created');

    // Poll for scene states
    let idx = 0;
    function check() {
        const key = toTest[idx];
        const scene = game.scene.getScene(key);

        // Check if current scene has finished create (status >= RUNNING)
        if (scene && scene.scene.isActive()) {
            if (!tested.has(key)) {
                tested.add(key);
                out('✓ Scene OK: ' + key);
                // An NPC whose spritesheet failed to load falls back to a placeholder rectangle
                const placeholders = (scene.npcList || []).filter(n => !scene.textures.exists(n.cfg?.sprite)).map(n => n.id);
                if (placeholders.length) errors.push(`${key}: NPC sprites not loaded: ${placeholders.join(', ')}`);
                // Quest spots must be somewhere the player can walk to
                if (scene._walk) {
                    const col = scene.cache.json.get(`world${scene._worldNum}_collision`) || {};
                    (col.spots || []).forEach(sp => {
                        if (!scene._walk.isReachable(sp.x, sp.y)) errors.push(`${key}: spot ${sp.id} at ${sp.x},${sp.y} is not reachable`);
                        if (sp.secret) secretSpots.add(sp.id);
                        [].concat(sp.set || []).forEach(f => spotSets.add(f));
                    });
                    // _tryTalk needs the player SPRITE centre within 60 px (display) of the NPC. The tile
                    // flood fill under-approximates (it needs whole tiles free), so flood the real
                    // collision box over walls and NPC bodies in 4 px steps instead.
                    const pos = finePositions(scene, col);
                    const spr = scene.player.sprite, body = spr.body;
                    const offX = body.center.x - spr.x, offY = body.center.y - spr.y;
                    (col.npcs || []).forEach(n => {
                        const nx = n.x * scene._S, ny = n.y * scene._S;
                        if (!pos.some(([bx, by]) => Math.hypot(bx - offX - nx, by - offY - ny) < 60))
                            errors.push(`${key}: NPC ${n.id} at ${n.x},${n.y} cannot be talked to (player can't get within range)`);
                    });
                    if (scene._hudPapers === undefined) errors.push(`${key}: no paper counter in the HUD`);
                }
                idx++;
                if (idx < toTest.length) {
                    // Start next scene
                    game.scene.start(toTest[idx]);
                } else {
                    checkQuestData().catch(e => errors.push('Quest data check failed: ' + e)).then(finish);
                    return;
                }
            }
        }
        if (document.title === 'RUNNING') setTimeout(check, 300);
    }
    // Give first scene time to preload + create
    setTimeout(check, 1500);

} catch(e) {
    errors.push('Game creation failed: ' + e.message);
    finish();
}

setTimeout(() => {
    if (document.title === 'RUNNING') {
        const missing = toTest.filter(k => !tested.has(k));
        errors.push('Timeout — scenes not booted: ' + missing.join(', '));
        finish();
    }
}, 30000);
</script>
</body></html>
